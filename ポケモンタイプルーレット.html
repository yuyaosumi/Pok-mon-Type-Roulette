<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモンタイプ ルーレット</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
      color: #333;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 90%;
      max-width: 480px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #444;
    }

    /* ルーレット表示エリア */
    .roulette-box {
      height: 100px;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background-color: #eee;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }

    .type-card {
      font-size: 2rem;
      font-weight: bold;
      color: white;
      padding: 10px 30px;
      border-radius: 8px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      min-width: 150px;
    }

    /* 操作ボタン */
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #start-btn {
      background-color: #ff4757;
      color: white;
    }

    #reset-btn {
      background-color: #747d8c;
      color: white;
    }

    /* 残りタイプのリスト表示 */
    .remaining-info {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    .remaining-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-height: 150px;
      overflow-y: auto;
      padding: 8px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .mini-badge {
      font-size: 0.75rem;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ポケモンタイプ ルーレット</h1>
    
    <div class="roulette-box" id="roulette-box">
      <div class="type-card" id="display-type" style="background-color: #aaa;">STARTを押してね</div>
    </div>

    <div class="btn-group">
      <button id="start-btn">スタート</button>
      <button id="reset-btn">リセット</button>
    </div>

    <div class="remaining-info">
      残りタイプ (<span id="remaining-count">18</span>/18)
    </div>
    <div class="remaining-list" id="remaining-list"></div>
  </div>

  <script>
    // ポケモンの全18タイプと専用カラーの設定
    const POKEMON_TYPES = [
      { name: "ノーマル", color: "#A8A878" },
      { name: "ほのお", color: "#F08030" },
      { name: "みず", color: "#6890F0" },
      { name: "くさ", color: "#78C850" },
      { name: "でんき", color: "#F8D030" },
      { name: "こおり", color: "#98D8D8" },
      { name: "かくとう", color: "#C03028" },
      { name: "どく", color: "#A040A0" },
      { name: "じめん", color: "#E0C068" },
      { name: "ひこう", color: "#A890F0" },
      { name: "エスパー", color: "#F85888" },
      { name: "むし", color: "#A8B820" },
      { name: "いわ", color: "#B8A038" },
      { name: "ゴースト", color: "#705898" },
      { name: "ドラゴン", color: "#7038F8" },
      { name: "あく", color: "#705848" },
      { name: "はがね", color: "#B8B8D0" },
      { name: "フェアリー", color: "#EE99AC" }
    ];

    // 現在残っているタイプの配列
    let remainingTypes = [...POKEMON_TYPES];
    let isSpinning = false;

    // DOM要素の取得
    const displayType = document.getElementById("display-type");
    const startBtn = document.getElementById("start-btn");
    const resetBtn = document.getElementById("reset-btn");
    const remainingCount = document.getElementById("remaining-count");
    const remainingList = document.getElementById("remaining-list");

    // 残りタイプ一覧UIの更新
    function updateRemainingUI() {
      remainingCount.textContent = remainingTypes.length;
      remainingList.innerHTML = "";
      
      remainingTypes.forEach(type => {
        const badge = document.createElement("span");
        badge.className = "mini-badge";
        badge.textContent = type.name;
        badge.style.backgroundColor = type.color;
        remainingList.appendChild(badge);
      });
    }

    // 表示パーツの描画更新
    function setTypeDisplay(type) {
      displayType.textContent = type.name;
      displayType.style.backgroundColor = type.color;
    }

    // ルーレット処理
    function startRoulette() {
      if (isSpinning || remainingTypes.length === 0) return;

      isSpinning = true;
      startBtn.disabled = true;
      resetBtn.disabled = true;

      let speed = 50; // シャッフルの速度(ms)
      let counter = 0;
      const totalTicks = 25; // 停止までに画面が変わる回数

      // 当選するタイプをあらかじめ確定＆配列から削除（重複防止）
      const selectedIndex = Math.floor(Math.random() * remainingTypes.length);
      const selectedType = remainingTypes.splice(selectedIndex, 1)[0];

      // パッパッと切り替わるパラパラアニメーション
      const interval = setInterval(() => {
        // パラパラ中は全タイプからランダム表示して雰囲気を出す
        const randomTemp = POKEMON_TYPES[Math.floor(Math.random() * POKEMON_TYPES.length)];
        setTypeDisplay(randomTemp);
        
        counter++;
        if (counter >= totalTicks) {
          clearInterval(interval);
          
          // 決定したタイプを表示
          setTypeDisplay(selectedType);
          updateRemainingUI();
          
          isSpinning = false;
          resetBtn.disabled = false;
          
          // まだ残っていればスタートボタンを有効化
          if (remainingTypes.length > 0) {
            startBtn.disabled = false;
          } else {
            startBtn.textContent = "完 了";
          }
        }
      }, speed);
    }

    // リセット処理
    function resetRoulette() {
      if (isSpinning) return;

      remainingTypes = [...POKEMON_TYPES];
      updateRemainingUI();

      displayType.textContent = "READY";
      displayType.style.backgroundColor = "#aaa";
      
      startBtn.disabled = false;
      startBtn.textContent = "スタート";
    }

    // イベントリスナーの登録
    startBtn.addEventListener("click", startRoulette);
    resetBtn.addEventListener("click", resetRoulette);

    // 初期化
    updateRemainingUI();
  </script>
</body>
</html>
